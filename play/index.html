<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Evan &amp; Aama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#F6F0E5;font-family:'Fredoka',system-ui,-apple-system,sans-serif}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .stage{position:relative;width:min(100vw,90vh);aspect-ratio:9/10;container-type:inline-size;overflow:hidden;background:#F6F0E5}
  @supports (height:100dvh){.stage{width:min(100vw,calc(100dvh * .9))}}
  svg#scene-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}

  .bubble{position:absolute;top:2.2%;left:4%;right:4%;background:#fff;border-radius:5cqw;padding:2.2cqw 3.4cqw;z-index:3;
    font-size:clamp(15px,4.4cqw,36px);line-height:1.25;color:#24324A;box-shadow:0 1cqw 0 rgba(0,0,0,.12);
    border:.7cqw solid #59B7FF;transition:opacity .25s;min-height:9cqw;box-sizing:border-box}
  .who{display:inline-block;font-weight:700;font-size:.8em;padding:.08em .6em;border-radius:1em;margin-right:.4em;color:#fff;vertical-align:.08em}
  .hidden{opacity:0;pointer-events:none}
  .chips{position:absolute;right:3%;top:20%;display:flex;flex-direction:column;gap:1.4cqw;z-index:2}
  .chip{background:rgba(255,255,255,.92);border-radius:4cqw;padding:.8cqw 2.2cqw .8cqw 1cqw;font-size:3.3cqw;font-weight:600;color:#24324A;
    display:flex;align-items:center;gap:1cqw;box-shadow:0 .5cqw 0 rgba(0,0,0,.12);border:.5cqw solid #ccc}
  .chip .face{font-size:5.5cqw;line-height:1}

  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(242,235,223,.6);z-index:5;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:opacity .35s}
  .card{background:#fff;border-radius:6cqw;padding:5cqw 6cqw;text-align:center;width:80%;box-sizing:border-box;
    box-shadow:0 2cqw 0 rgba(0,0,0,.12);border:1cqw solid #FFD43B}
  .kicker{font-size:3.6cqw;color:#7A879C;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
  h1{font-size:9.5cqw;margin:.05em 0;color:#2F6FD6;line-height:1}
  h2{font-size:6.4cqw;margin:.3em 0 .6em;color:#2E9C8A;line-height:1.1}
  .big{font-family:inherit;font-size:6cqw;font-weight:700;border:none;border-radius:4cqw;padding:2.2cqw 7cqw;background:#2FBF71;color:#fff;
    box-shadow:0 1.2cqw 0 #1E8A50;cursor:pointer}
  .big:active{transform:translateY(1cqw);box-shadow:0 .2cqw 0 #1E8A50}
  .small{font-family:inherit;font-size:3.8cqw;font-weight:600;border:none;border-radius:3cqw;padding:1.6cqw 4cqw;background:#EEF2F8;color:#2F6FD6;cursor:pointer;margin:2.5cqw 1cqw 0}
  .note{font-size:3.3cqw;color:#6A778C;margin:4cqw 0 0;line-height:1.3}
  .tip{background:#FFF6D6;border-radius:3cqw;padding:3cqw 3.5cqw;font-size:4.3cqw;color:#5A4A1A;margin:0 0 4cqw;text-align:left;line-height:1.3}
  .tip b{color:#E08A00}
  .heroes{display:flex;justify-content:center;align-items:flex-end;gap:2cqw;margin:1cqw 0 2cqw}

  #menu{position:absolute;inset:0;z-index:6;background:linear-gradient(#FDF7EC,#EEF6F3);overflow-y:auto;-webkit-overflow-scrolling:touch}
  #menu .top{display:flex;align-items:center;gap:3cqw;padding:5cqw 5cqw 2cqw}
  #menu .top img{height:26cqw}
  #menu .brand h1{font-size:8.5cqw;margin:0}
  #menu .brand p{margin:.6cqw 0 0;font-size:3.6cqw;color:#5A6B82}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;padding:2cqw 5cqw 6cqw}
  .ep{background:#fff;border-radius:4cqw;padding:3cqw;box-shadow:0 1cqw 0 rgba(0,0,0,.08);border:.6cqw solid #F0E6D2;cursor:pointer;text-align:left;font-family:inherit}
  .ep .ico{font-size:9cqw;line-height:1}
  .ep .num{font-size:3cqw;color:#8A97AA;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:1.2cqw}
  .ep .t{font-size:4.2cqw;font-weight:700;color:#24324A;line-height:1.15;margin-top:.4cqw}
  .ep .s{font-size:3cqw;color:#6A778C;margin-top:.6cqw}
  .ep.done{border-color:#2FBF71}
  .season{grid-column:1/-1;display:flex;align-items:baseline;gap:2cqw;margin:2cqw 0 0;padding-bottom:1cqw;border-bottom:.5cqw solid #E9DFC9}
  .season b{font-size:6cqw;color:#2F6FD6}.season span{font-size:3.8cqw;color:#5A6B82;font-weight:600}
  .ptalk{transform-box:fill-box;transform-origin:50% 100%}
  .ptalk.talk{animation:talk .55s ease-in-out infinite alternate}
  @keyframes talk{to{transform:translateY(-6px) scaleY(1.01)}}
  .pwalk.walking{animation:step .32s ease-in-out infinite alternate}

  #muteBtn,#homeBtn,#pauseBtn,#skipBtn{position:absolute;bottom:2.5%;width:10cqw;height:10cqw;border-radius:50%;border:none;background:rgba(255,255,255,.92);z-index:3;
    font-size:5cqw;box-shadow:0 .6cqw 0 rgba(0,0,0,.15);cursor:pointer;padding:0}
  #muteBtn{left:2.5%} #homeBtn{left:14.5%} #pauseBtn{left:26.5%} #skipBtn{left:38.5%}
  #stage.paused #scene-svg{filter:saturate(.6) brightness(.9)}

  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
  @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.18);opacity:.55}}
  #aamaPos{transition:transform 1.1s cubic-bezier(.45,0,.3,1)}
  #aamaBob{animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translate(0,0)}25%{transform:translate(6px,-10px)}50%{transform:translate(0,-16px)}75%{transform:translate(-6px,-8px)}}
  #aamaSpin{transform-box:fill-box;transform-origin:center}
  #aamaSpin.wiggle{animation:wiggle .5s ease-in-out 4}
  @keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
  #evanWalk.walking{animation:step .3s ease-in-out infinite alternate}
  @keyframes step{from{transform:translateY(0)}to{transform:translateY(-10px) rotate(1.5deg)}}
  #evanWalk.sway{animation:sway .5s ease-in-out infinite alternate}
  @keyframes sway{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
  #evanJump.jump{animation:jump .6s ease-in-out 3}
  @keyframes jump{50%{transform:translateY(-45px)}}
  #evanImg{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s}
  #beam{animation:flick .22s infinite alternate}
  @keyframes flick{to{opacity:.14}}
  #hintRing{transform-box:fill-box;transform-origin:center;animation:ring 1.1s ease-out infinite}
  @keyframes ring{0%{transform:scale(.85);opacity:1}100%{transform:scale(1.22);opacity:.25}}
  #hintHand{animation:poke 1.1s ease-in-out infinite}
  @keyframes poke{50%{transform:translateY(-16px)}}
  .ringx{transform-box:fill-box;transform-origin:center;animation:ring 1.1s ease-out infinite}
  .shake{transform-box:fill-box;transform-origin:center;animation:shake .4s ease-in-out}
  @keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .spin{transform-box:fill-box;transform-origin:center}
  .confetti{position:absolute;top:-5%;width:2.2cqw;height:3.2cqw;border-radius:.5cqw;animation:fall linear forwards;pointer-events:none;z-index:2}
  @keyframes fall{to{transform:translateY(125cqw) rotate(720deg)}}
  .hit{cursor:pointer}
  #puddle{transform-box:fill-box;transform-origin:center;transition:transform .5s ease,opacity .4s}
  #counterWet{transform-box:fill-box;transform-origin:center;transition:transform .5s,opacity .4s}
  #ripple{transform-box:fill-box;transform-origin:center}
  #handle{transform-box:view-box;transform-origin:440px 495px;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
</style>
</head>
<body>
<div class="stage" id="stage">
<svg id="scene-svg" viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg">
  <defs id="defs">
    <radialGradient id="glow"><stop offset="0" stop-color="#6FF7FF" stop-opacity=".9"/><stop offset="1" stop-color="#6FF7FF" stop-opacity="0"/></radialGradient>
    <filter id="shadowF" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#3A2A18" flood-opacity=".28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <g id="scene"></g>
  <g id="drops"></g>
  <g id="people"></g>
  <g id="evanPos" style="transform:translate(200px,955px)">
    <g id="evanJump"><g id="evanWalk">
      <ellipse cx="0" cy="0" rx="80" ry="12" fill="#000" opacity=".12"/>
      <image id="evanImg" href="evan.webp" x="-172" y="-430" width="344" height="430" filter="url(#shadowF)"/>
      <g id="evanHeld"></g>
    </g></g>
    <ellipse class="hit" data-k="evan" cx="0" cy="-215" rx="105" ry="220" fill="transparent" pointer-events="all"/>
  </g>
  <g id="aamaPos" style="transform:translate(734px,945px)">
    <ellipse class="pulse" cx="0" cy="3" rx="82" ry="14" fill="url(#glow)"/>
    <g id="aamaBob"><g id="aamaSpin"><image href="aama.webp" x="-139" y="-320" width="278" height="320" filter="url(#shadowF)"/></g></g>
    <ellipse id="aamaHit" class="hit" data-k="aama" cx="0" cy="-160" rx="125" ry="175" fill="transparent" pointer-events="all"/>
  </g>
  <g id="front"></g>
  <g id="fx" style="display:none" pointer-events="none">
    <polygon id="beam" points="0,0 0,0 0,0" fill="#6FF7FF" opacity=".36"/>
    <ellipse id="scanRing" cx="0" cy="0" rx="10" ry="10" fill="#6FF7FF" fill-opacity=".08" stroke="#2EDDEE" stroke-width="5" stroke-dasharray="14 10"/>
    <line id="scanLine" x1="0" y1="0" x2="0" y2="0" stroke="#2EDDEE" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="hint" style="display:none" pointer-events="none">
    <g id="hintRings"></g>
    <g id="hintExtra"></g>
    <text id="hintHand" x="0" y="0" font-size="72" text-anchor="middle">👆</text>
  </g>
  <g id="hits"></g>
</svg>

<div id="chips" class="chips"></div>
<div id="bubble" class="bubble hidden"><span class="who" id="who"></span><span id="line"></span></div>
<button id="muteBtn" aria-label="Sound on or off">🔊</button>
<button id="homeBtn" aria-label="All episodes">🏠</button>
<button id="pauseBtn" aria-label="Pause">⏸</button>
<button id="skipBtn" aria-label="Next episode">⏭</button>
<div id="paused" class="overlay hidden"><div class="card"><h2 style="color:#2F6FD6;font-size:8cqw;margin:.2em 0 .5em">Paused</h2><button id="resumeBtn" class="big">▶ Keep going</button><div><button class="small" id="pNextBtn">Next episode ⏭</button><button class="small" data-go="home">🏠 All episodes</button></div></div></div>

<div id="start" class="overlay hidden">
  <div class="card">
    <div class="heroes"><img src="evan.webp" alt="Evan" style="height:26cqw"><img src="aama.webp" alt="Aama" style="height:21cqw"></div>
    <div class="kicker" id="startNum">Episode 1</div>
    <h2 id="startTitle" style="font-size:7.5cqw;margin:.2em 0 .5em">Drip, Drip, Stop!</h2>
    <button id="playBtn" class="big">▶ Play</button>
    <div><button class="small" data-go="home">All episodes</button></div>
    <p class="note">Turn the sound on. For little fixers age 3 and up, with a grown-up nearby.</p>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="card">
    <div class="stars" style="font-size:9cqw;line-height:1">⭐⭐⭐</div>
    <h2 style="color:#2F6FD6;font-size:8cqw;margin:.25em 0 .5em">You fixed it!</h2>
    <div class="tip"><b>Fixer tip:</b> <span id="tipText"></span></div>
    <button id="nextBtn" class="big">Next episode ▶</button>
    <div><button class="small" id="againBtn">🔁 Play again</button><button class="small" data-go="home">All episodes</button></div>
  </div>
</div>

<div id="menu">
  <div class="top">
    <img src="evan.webp" alt="Evan"><img src="aama.webp" alt="Aama" style="height:21cqw">
    <div class="brand"><h1>Evan &amp; Aama</h1><p>Seasons 1 and 2 · Little hands can fix big things</p></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
</div>

<script src="lines.js?v=1795300303"></script>
<script src="scene1.js?v=1795300303"></script>
<script src="engine.js?v=1795300303"></script>
<script src="episodes.js?v=1795300303"></script>
<script src="episodes2.js?v=1795300303"></script>
<script src="episodes3.js?v=1795300303"></script>
<script>Game.boot();</script>
</body>
</html>
